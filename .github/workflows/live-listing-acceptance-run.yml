name: Live Listing Acceptance — Controlled Run

on:
  push:
    branches:
      - live-listing-acceptance-run-20261008
    paths:
      - scripts/verify-live-listing-acceptance.mjs
      - .github/workflows/live-listing-acceptance-run.yml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify controlled live listing and unpublished boundary
        env:
          MLG_SITE_ORIGIN: https://marylandlocalguide.com
          MLG_ACCEPT_PUBLISHED_SLUG: mlg-qa-live-accept-20261008-pub
          MLG_ACCEPT_PENDING_SLUG: mlg-qa-live-accept-20261008-pending
          MLG_ACCEPT_CATEGORY_SLUG: masonry
          MLG_ACCEPT_LOCATION_SLUG: aberdeen
          MLG_ACCEPT_LOCATION_MODE: service-area
        run: node scripts/verify-live-listing-acceptance.mjs
      - name: Upload bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-listing-acceptance-run
          path: artifacts/live-listing-acceptance.json
          if-no-files-found: error
          retention-days: 7
